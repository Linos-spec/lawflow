<!doctype html>
<html lang="en">
<head>

<title>Offline — Linoscore Legal</title>
<style>

<body>
  <div class="card">

      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
