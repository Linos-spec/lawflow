name: lawflow
region: nyc
domains:
  - domain: law.linoscore.com
    type: PRIMARY
services:
  - name: lawflow-web
    dockerfile_path: Dockerfile
    github:
      repo: Linos-spec/lawflow
      branch: main
      deploy_on_push: true
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: "${db-lawflow.DATABASE_URL}"
      - key: NEXTAUTH_URL
        scope: RUN_TIME
        value: "https://law.linoscore.com"
      # Secrets are managed in the DigitalOcean dashboard / via `doctl apps update`.
      # Do NOT commit real secret values here. Set these in the app's env config.
      - key: NEXTAUTH_SECRET
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        value: "set-in-dashboard"
      - key: AUTH_SECRET
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        value: "set-in-dashboard"
      - key: OPENAI_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: "set-in-dashboard"
      - key: NODE_ENV
        scope: RUN_AND_BUILD_TIME
        value: "production"
databases:
  - name: db-lawflow
    engine: PG
    production: false
